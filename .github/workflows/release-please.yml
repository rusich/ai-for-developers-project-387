name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Единый пакет объявлен на корне репозитория (путь "." в
          # release-please-config.json), релизный компонент — call-booking-backend.
          # Включаем имя компонента в тег, чтобы теги совпадали с прошлыми
          # релизами и ссылками в changelog (теги вида call-booking-backend-vX.Y.Z).
          include-component-in-tag: true
