name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  backend:
    name: Backend tests + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Unit and integration tests
        run: cargo test
        working-directory: backend

      - name: Build binary
        run: cargo build
        working-directory: backend

      - name: Smoke test API client against backend
        run: |
          ./backend/target/debug/call-booking-backend > /tmp/backend.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/event-types > /dev/null 2>&1; then break; fi
            sleep 1
          done
          node frontend/smoke-test.mjs http://127.0.0.1:3000 dev-token
          kill $PID

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: cargo build
        working-directory: backend

      - name: Run e2e tests
        run: npx playwright test
