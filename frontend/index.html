<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на звонок</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Применяем сохранённый выбор темы до загрузки CSS — без «мигания».
    // Режим «авто» (нет записи) оставляет атрибут снятым — работает prefers-color-scheme.
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) { /* localStorage недоступен — остаёмся на системной теме */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <main id="main" class="container">
    <div class="topbar">
      <button type="button" class="secondary" data-theme-toggle aria-pressed="false">Тема: авто</button>
    </div>
    <h1>Запись на звонок</h1>

    <!-- Шаг 1: выбор типа события -->
    <section id="step-type">
      <h2>1. Выберите тип встречи</h2>
      <div id="event-types" class="cards">
        <p class="muted">Загрузка…</p>
      </div>
    </section>

    <!-- Шаг 2: выбор слота -->
    <section id="step-slot" hidden>
      <h2>2. Выберите время <span id="chosen-type" class="muted"></span></h2>
      <div id="days" class="days"></div>
      <div id="slots" class="slots"></div>
      <p id="slots-empty" class="empty-state" hidden aria-live="polite"></p>
    </section>

    <!-- Шаг 3: данные гостя -->
    <section id="step-form" hidden>
      <h2>3. Ваши данные</h2>
      <p>Вы записываетесь на <strong id="chosen-slot"></strong></p>
      <form id="booking-form" novalidate>
        <label>
          Имя
          <input type="text" name="attendeeName" required minlength="1" autocomplete="name">
        </label>
        <label>
          Email
          <input type="email" name="attendeeEmail" required autocomplete="email">
        </label>
        <div class="form-actions">
          <button type="submit" id="booking-submit">Забронировать</button>
          <button type="button" id="back-to-slots" class="secondary">Назад</button>
        </div>
      </form>
    </section>

    <!-- Шаг 4: успех -->
    <section id="step-done" hidden role="status">
      <div class="done">
        <span class="done-icon" aria-hidden="true">✓</span>
        <h2>Готово!</h2>
        <p id="confirmation" class="done-text"></p>
        <dl class="done-details" id="done-details"></dl>
      </div>
      <div class="form-actions">
        <button id="book-another" class="secondary">Записаться ещё раз</button>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <footer class="footer">
    <span id="app-version" class="muted"></span>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
